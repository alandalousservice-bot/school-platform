server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # يمرّر كل طلبات API إلى حاوية FastAPI عبر شبكة Docker الداخلية
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # لا تخزّن Service Worker في الكاش كي تصل تحديثاته فورًا لكل الأجهزة
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # تطبيق React (SPA) — أي مسار غير موجود كملف يعود إلى index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: school
      POSTGRES_PASSWORD: ${DB_PASSWORD:?يجب تعيين DB_PASSWORD في ملف .env}
      POSTGRES_DB: school
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://school:${DB_PASSWORD}@db:5432/school
      SECRET_KEY: ${SECRET_KEY:?يجب تعيين SECRET_KEY في ملف .env}
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: ""
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata:
